name: Publish Pterodactyl Yolk

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GHCR_OWNER: vanillachan6571

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - overhaul/livekit-media-core
      - rework/screensharing
    paths:
      - ".github/workflows/publish-pterodactyl-yolk.yml"
      - "docker/pterodactyl-yolk/Dockerfile"
      - "docker/pterodactyl-yolk/entrypoint.sh"
      - "pterodactyl-egg/egg-cat-realm-server.json"
      - "pterodactyl-egg/EGG_REPOSITORY.md"
      - "docs/PTERODACTYL_RUNTIME_IMAGE.md"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Current runtime: official Node image, pinned patch release.
          - node: "24"
            base: node:24.22.2-alpine
          # Legacy tag kept for servers that have not switched images yet.
          - node: "20"
            base: ghcr.io/pterodactyl/yolks:nodejs_20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/pterodactyl-yolk/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: |
            ghcr.io/${{ env.GHCR_OWNER }}/catrealm-selfhostable-server-yolk:nodejs_${{ matrix.node }}
            ghcr.io/${{ env.GHCR_OWNER }}/catrealm-selfhostable-server-yolk:nodejs_${{ matrix.node }}-livekit
